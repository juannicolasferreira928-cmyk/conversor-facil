<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor Fácil</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .caixa {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #0002;
    }

    h1 {
      color: #1976d2;
    }

    .conversor {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #f7f7f7;
    }

    input, select, button {
      width: 90%;
      padding: 12px;
      margin: 7px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background: #1976d2;
      color: white;
      border: none;
    }

    p[id^="resultado"] {
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="caixa">

    <h1>🔄 Conversor Fácil</h1>
    <p>Conversões simples, rápidas e gratuitas.</p>

    <!-- DISTÂNCIA -->
    <div class="conversor">
      <h2>📏 Distância</h2>

      <input type="number" id="valor" placeholder="Digite um valor">

      <select id="unidade">
        <option value="km">Quilômetros → Metros</option>
        <option value="m">Metros → Quilômetros</option>
        <option value="cm">Centímetros → Metros</option>
      </select>

      <button onclick="converter()">Converter</button>

      <p id="resultado"></p>
    </div>

    <!-- PESO -->
    <div class="conversor">
      <h2>⚖️ Peso</h2>

      <input type="number" id="peso" placeholder="Digite um valor">

      <select id="unidadePeso">
        <option value="kg">Quilogramas → Gramas</option>
        <option value="g">Gramas → Quilogramas</option>
        <option value="mg">Miligramas → Gramas</option>
      </select>

      <button onclick="converterPeso()">Converter</button>

      <p id="resultadoPeso"></p>
    </div>

    <!-- VOLUME -->
    <div class="conversor">
      <h2>🧪 Volume</h2>

      <input type="number" id="volume" placeholder="Digite um valor">

      <select id="unidadeVolume">
        <option value="l">Litros → Mililitros</option>
        <option value="ml">Mililitros → Litros</option>
      </select>

      <button onclick="converterVolume()">Converter</button>

      <p id="resultadoVolume"></p>
    </div>

    <!-- TEMPERATURA -->
    <div class="conversor">
      <h2>🌡️ Temperatura</h2>

      <input type="number" id="temperatura" placeholder="Digite um valor">

      <select id="unidadeTemperatura">
        <option value="c-f">Celsius → Fahrenheit</option>
        <option value="f-c">Fahrenheit → Celsius</option>
        <option value="c-k">Celsius → Kelvin</option>
        <option value="k-c">Kelvin → Celsius</option>
      </select>

      <button onclick="converterTemperatura()">Converter</button>

      <p id="resultadoTemperatura"></p>
    </div>

  </div>

  <script>

    function converter() {
      let valor = Number(document.getElementById("valor").value);
      let unidade = document.getElementById("unidade").value;
      let resultado = "";

      if (unidade === "km") {
        resultado = valor * 1000 + " metros";
      }

      if (unidade === "m") {
        resultado = valor / 1000 + " quilômetros";
      }

      if (unidade === "cm") {
        resultado = valor / 100 + " metros";
      }

      document.getElementById("resultado").innerText = resultado;
    }


    function converterPeso() {
      let valor = Number(document.getElementById("peso").value);
      let unidade = document.getElementById("unidadePeso").value;
      let resultado = "";

      if (unidade === "kg") {
        resultado = valor * 1000 + " gramas";
      }

      if (unidade === "g") {
        resultado = valor / 1000 + " quilogramas";
      }

      if (unidade === "mg") {
        resultado = valor / 1000 + " gramas";
      }

      document.getElementById("resultadoPeso").innerText = resultado;
    }


    function converterVolume() {
      let valor = Number(document.getElementById("volume").value);
      let unidade = document.getElementById("unidadeVolume").value;
      let resultado = "";

      if (unidade === "l") {
        resultado = valor * 1000 + " mililitros";
      }

      if (unidade === "ml") {
        resultado = valor / 1000 + " litros";
      }

      document.getElementById("resultadoVolume").innerText = resultado;
    }


    function converterTemperatura() {
      let valor = Number(document.getElementById("temperatura").value);
      let unidade = document.getElementById("unidadeTemperatura").value;
      let resultado = "";

      if (unidade === "c-f") {
        resultado = (valor * 9 / 5 + 32).toFixed(2) + " °F";
      }

      if (unidade === "f-c") {
        resultado = ((valor - 32) * 5 / 9).toFixed(2) + " °C";
      }

      if (unidade === "c-k") {
        resultado = (valor + 273.15).toFixed(2) + " K";
      }

      if (unidade === "k-c") {
        resultado = (valor - 273.15).toFixed(2) + " °C";
      }

      document.getElementById("resultadoTemperatura").innerText = resultado;
    }

  </script>

</body>
</html>
